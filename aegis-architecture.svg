  <path class="arrow" d="M985 702 C845 790,415 740,395 865"/>
  <path class="arrow" d="M1230 702 C1320 702,1325 540,310 540"/>
  <path class="arrow" d="M1230 725 C1320 760,320 620,310 620"/>
  <path class="arrow" d="M1230 735 C1320 820,360 900,310 900"/>

  <text x="1250" y="210" class="mono">slot/leader streams</text>
  <text x="1250" y="293" class="mono">commitment evidence</text>
  <text x="1248" y="435" class="mono">submit bundle</text>
  <text x="1248" y="525" class="mono">bundle status</text>
  <text x="1260" y="657" class="mono">facts</text>
  <text x="1260" y="722" class="mono">decision</text>
  <text x="1250" y="884" class="mono">exports</text>

  <rect x="390" y="1015" width="840" height="38" class="dark"/>
  <text x="420" y="1039" class="white">Hot path: bounded channels -> goroutine worker pools -> sharded lifecycle updates -> status snapshots</text>
  <rect x="390" y="1065" width="840" height="38" class="dark"/>
  <text x="420" y="1089" class="white">Durable path: River jobs -> retry, delayed resubmit, webhook delivery, lifecycle export, replay, dead-letter</text>

  <text x="70" y="1145" class="subtitle">Core loop: stream network state -> schedule leader window -> build and submit Jito bundle -> track each transaction individually -> classify failures -> AI changes retry/tip/timing -> notify clients and persist evidence.</text>
</svg>
