services:
  postgres:
    image: postgres:16-alpine
    container_name: tx-pilot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: txpilot
    ports:
      - "5432:5432"
    volumes:
      - tx_pilot_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d txpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tx_pilot_pg_data:
